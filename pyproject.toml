[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = "Lightweight API Gateway with auth, routing, rate limiting, and transformation"
authors = ["You <you@example.com>"]
readme = "README.md"
packages = [{include = "gateway", from = "src"}]

[tool.poetry.dependencies]
python = "~3.12.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
httpx = "^0.27.2"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
pyjwt = "^2.9.0"
structlog = "^24.4.0"
prometheus-client = "^0.21.0"
pyyaml = "^6.0.2"
redis = "^5.1.0"
asyncpg = "^0.29.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
respx = "^0.21.1"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true